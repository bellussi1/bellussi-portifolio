<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Conceito do Black Market, companion de inventário e receitas</title>
  <desc id="desc">Ilustração conceitual de um inventário de jogo ligado a uma árvore de receita, com revisão manual dos materiais.</desc>
  <rect width="1200" height="900" fill="#181a1c"/>
